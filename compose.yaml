services:
  app:
    image: ${PORTFOLIO_IMAGE:?Set PORTFOLIO_IMAGE to the verified commit-tagged application image.}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    networks:
      - private
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  proxy:
    build:
      context: ./infra/nginx
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT to the release commit SHA.}
    image: ${PORTFOLIO_PROXY_IMAGE:?Set PORTFOLIO_PROXY_IMAGE to the verified commit-tagged proxy image.}
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to the lowercase canonical host.}
    networks:
      - private
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - type: bind
        source: ${TLS_CERTS_DIR:?Set TLS_CERTS_DIR to the directory with live TLS certificates.}
        target: /etc/letsencrypt
        read_only: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

networks:
  private:
    internal: true
